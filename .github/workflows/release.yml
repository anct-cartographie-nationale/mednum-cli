---
name: Transform and publish

on:
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm build
      - name: Upload build bundle as artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: |
            !assets
            package.json
            dist

  publish:
    name: Publish package to npm
    runs-on: ubuntu-latest
    needs:
      - build

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: bundle
      - name: Link the semantic release config and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          ln -s .tooling/.semantic-release/.semantic-release.config.cjs release.config.cjs
          ln -s .tooling/.semantic-release/.npmignore .npmignore
          npx semantic-release

  process-data:
    name: Process data
    uses: ./.github/workflows/process-data.reusable.yml
    with:
      sources: '[
        "charente-maritime",
        "coop-numerique",
        "dora",
        "france-services",
        "france-travail",
        "francil-in",
        "fredo",
        "grand-paris-sud",
        "herault",
        "hinaura",
        "mednum-bfc",
        "meuse",
        "mulhouse",
        "les-landes",
        "loire-atlantique",
        "manche",
        "numi",
        "paca",
        "paris",
        "res-in",
        "rhin-occ",
        "siilab",
        "vendee",
        "vosges"
        ]'
      environment: production
    secrets:
      COOP_API_KEY: ${{ secrets.COOP_API_KEY }}
      DATA_INCLUSION_API_KEY: ${{ secrets.DATA_INCLUSION_API_KEY }}
      DATA_GOUV_API_URL: ${{ secrets.DATA_GOUV_API_URL }}
      DATA_GOUV_API_KEY: ${{ secrets.DATA_GOUV_API_KEY }}
      DATA_GOUV_REFERENCE_ID: ${{ secrets.DATA_GOUV_REFERENCE_ID }}
      DATA_GOUV_REFERENCE_TYPE: ${{ secrets.DATA_GOUV_REFERENCE_TYPE }}

  publish-deduplicated:
    name: Publish deduplicated dataset to data.gouv
    needs: process-data
    uses: ./.github/workflows/publish-deduplicated.reusable.yml
    with:
      environment: production
    secrets:
      DATA_GOUV_API_URL: ${{ secrets.DATA_GOUV_API_URL }}
      DATA_GOUV_API_KEY: ${{ secrets.DATA_GOUV_API_KEY }}
      DATA_GOUV_REFERENCE_ID: ${{ secrets.DATA_GOUV_REFERENCE_ID }}
      DATA_GOUV_REFERENCE_TYPE: ${{ secrets.DATA_GOUV_REFERENCE_TYPE }}
