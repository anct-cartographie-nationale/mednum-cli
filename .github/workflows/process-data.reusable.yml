---
name: Reusable Data transform, merge, deduplicate and publish

on:
  workflow_call:
    inputs:
      sources:
        description: List of sources to process
        required: true
        type: string
      environment:
        description: Environment to deploy to
        required: true
        type: string
      max_transform:
        description: Maximum number of lines to transform
        required: false
        type: number
    secrets:
      COOP_API_KEY:
        required: true
      DATA_INCLUSION_API_KEY:
        required: true
      DATA_GOUV_API_URL:
        required: true
      DATA_GOUV_API_KEY:
        required: true
      DATA_GOUV_REFERENCE_ID:
        required: true
      DATA_GOUV_REFERENCE_TYPE:
        required: true

jobs:
  transform:
    name: Transform
    strategy:
      # Une source qui casse ne doit pas emporter les 23 autres : le cumul d'adresses est
      # monotone, ce que les sources saines rapportent est toujours bon à prendre.
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.sources) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 'Create env file'
        run: |
          touch .env
          echo COOP_API_KEY="${{ secrets.COOP_API_KEY }}" >> .env
          echo DATA_INCLUSION_API_KEY="${{ secrets.DATA_INCLUSION_API_KEY }}" >> .env
      - name: Restore the address cache
        uses: actions/cache/restore@v6
        with:
          path: assets/input/addresses.json
          # Cette clé n'existe jamais en lecture : c'est le préfixe qui ramène l'entrée la plus
          # récente, celle qu'a écrite la dernière fusion réussie. Sans entrée, rien n'est posé
          # et le géocodage repart de zéro — dégradé, jamais faux.
          key: addresses-${{ github.run_id }}
          restore-keys: addresses-
      - name: Restore the Accès Libre export
        uses: actions/cache/restore@v6
        with:
          path: assets/input/acces-libre.csv
          key: acces-libre-${{ github.run_id }}
          restore-keys: acces-libre-
      - name: Restore the establishments index
        uses: actions/cache/restore@v6
        with:
          path: assets/input/annuaire-entreprises.json
          key: annuaire-
          restore-keys: annuaire-
      - name: Transform
        run: pnpm transformer.${{ matrix.source }}
      - name: Deduplicate
        run: pnpm dedupliquer.${{ matrix.source }}
      - name: Upload transformed data
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.source }}
          path: assets/output/${{ matrix.source }}

  publish:
    name: Publish to data.gouv
    continue-on-error: true
    strategy:
      matrix:
        source: ${{ fromJSON(inputs.sources) }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: transform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 'Create env file'
        run: |
          touch .env
          echo DATA_GOUV_API_URL="${{ secrets.DATA_GOUV_API_URL }}" >> .env
          echo DATA_GOUV_API_KEY="${{ secrets.DATA_GOUV_API_KEY }}" >> .env
          echo DATA_GOUV_REFERENCE_ID="${{ secrets.DATA_GOUV_REFERENCE_ID }}" >> .env
          echo DATA_GOUV_REFERENCE_TYPE="${{ secrets.DATA_GOUV_REFERENCE_TYPE }}" >> .env
      - name: Download transformed data
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.source }}
          path: assets/output/${{ matrix.source }}
      - name: Rename files to publish
        run: sed -i 's/-sans-doublons//g' ./assets/output/${{ matrix.source }}/publier.json
      - name: Publish
        run: pnpm publier.${{ matrix.source }}

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: transform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download all transformed data
        uses: actions/download-artifact@v8
        with:
          path: to-merge
          merge-multiple: true
      - name: Merge transformed data
        run: pnpm fusionner
      - name: Upload merged data
        uses: actions/upload-artifact@v7
        with:
          name: merged
          path: merged

  cache-addresses:
    name: Cache addresses
    runs-on: ubuntu-latest
    needs: transform
    # Contrairement à la fusion des lieux, qui exige que toutes les sources aient abouti sous
    # peine de publier un jeu national amputé, le cumul d'adresses est monotone : il ne fait
    # qu'ajouter. Une source en échec ne doit donc pas coûter la nuit de géocodage des autres.
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore the address cache
        uses: actions/cache/restore@v6
        with:
          path: assets/input/addresses.json
          key: addresses-${{ github.run_id }}
          restore-keys: addresses-
      - name: Download all transformed data
        uses: actions/download-artifact@v8
        with:
          path: to-merge
          merge-multiple: true
      - name: Merge the address cache
        run: pnpm fusionner.addresses
      - name: Save the address cache
        # Seules les exécutions de production alimentent le cache ; une validation de pull
        # request le lit sans jamais l'écrire.
        if: inputs.environment == 'production'
        uses: actions/cache/save@v6
        with:
          path: assets/input/addresses.json
          key: addresses-${{ github.run_id }}
      - name: Upload the address cache
        # Un instantané daté et téléchargeable du cumul, seule trace consultable depuis qu'il
        # ne vit plus dans le dépôt.
        uses: actions/upload-artifact@v7
        with:
          name: addresses
          path: assets/input/addresses.json

  cache-acces-libre:
    name: Cache Accès Libre
    runs-on: ubuntu-latest
    needs: transform
    if: ${{ !cancelled() }}
    steps:
      - name: Download the Accès Libre export
        run: |
          mkdir -p assets/input
          curl -sSL --retry 3 -o assets/input/acces-libre.csv \
            https://www.data.gouv.fr/api/1/datasets/r/93ae96a7-1db7-4cb4-a9f1-6d778370b640
      - name: Save the Accès Libre export
        uses: actions/cache/save@v6
        with:
          path: assets/input/acces-libre.csv
          key: acces-libre-${{ github.run_id }}

  cache-annuaire:
    name: Cache establishments index
    runs-on: ubuntu-latest
    needs: transform
    if: ${{ !cancelled() }}
    steps:
      - name: Compute the weekly cache key
        id: semaine
        run: echo "cle=annuaire-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the establishments index of the week
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: assets/input/annuaire-entreprises.json
          key: ${{ steps.semaine.outputs.cle }}
      - name: Checkout repository
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
      - name: Install pnpm
        if: steps.restore.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false
      - name: Set up Node.js
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download all transformed data
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          path: to-merge
          merge-multiple: true
      - name: Build the establishments index
        if: steps.restore.outputs.cache-hit != 'true'
        run: pnpm annuaire
      - name: Save the establishments index
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: assets/input/annuaire-entreprises.json
          key: ${{ steps.semaine.outputs.cle }}

  deduplicate:
    name: Deduplicate
    runs-on: ubuntu-latest
    needs: merge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download merged data
        uses: actions/download-artifact@v8
        with:
          name: merged
          path: assets/to-deduplicate
      - name: Deduplicate merged data
        run: pnpm dedupliquer.merged-json
      - name: Upload deduplicated data
        uses: actions/upload-artifact@v7
        with:
          name: deduplicated
          path: assets/deduplicated
